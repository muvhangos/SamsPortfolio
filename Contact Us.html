<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Samuel</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to right, #f0f4f8, #d9e4f5);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .contact-card {
      background: white;
      max-width: 800px;
      width: 100%;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.1);
    }

    .contact-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .contact-header h1 {
      font-size: 30px;
      color: #2c3e50;
    }

    .contact-item {
      display: flex;
      margin-bottom: 20px;
    }

    .contact-item img.icon {
      width: 20px;
      height: 20px;
      margin-right: 12px;
      margin-top: 4px;
    }

    .phone-icons {
      display: flex;
      gap: 12px;
      margin-top: 5px;
    }

    .phone-icons img {
      width: 18px;
      height: 18px;
      margin-right: 6px;
    }

    .inline-map {
      margin-top: 10px;
      height: 200px;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .contact-form {
      margin-top: 30px;
    }

    .contact-form h2 {
      font-size: 22px;
      margin-bottom: 20px;
      color: #2c3e50;
    }

    form {
      display: flex;
      flex-direction: column;
    }

    input, textarea {
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
    }

    button {
      background-color: #1d4ed8;
      color: white;
      border: none;
      padding: 12px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #163bbf;
    }

    #success-message {
      display: none;
      margin-top: 15px;
      color: green;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="contact-card">
    <div class="contact-header">
      <h1>Contact Samuel</h1>
    </div>

    <div class="contact-item">
      <img class="icon" src="https://cdn-icons-png.flaticon.com/512/732/732200.png" />
      <div>Email: <a href="mailto:muvhangos@gmail.com">muvhangos@gmail.com</a></div>
    </div>

    <div class="contact-item">
      <img class="icon" src="https://cdn-icons-png.flaticon.com/512/455/455705.png" />
      <div>
        Phone: +27 7249 55002
        <div class="phone-icons">
          <a href="tel:+27724955002"><img src="https://cdn-icons-png.flaticon.com/512/455/455705.png">Call</a>
          <a href="https://wa.me/27724955002" target="_blank"><img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg">WhatsApp</a>
        </div>
      </div>
    </div>

    <div class="contact-item">
    
      <div>
        Cell No: +27 8378 72798
        <div class="phone-icons">
          <a href="tel:+27837872798"><img src="https://cdn-icons-png.flaticon.com/512/455/455705.png">Call</a>
          <a href="https://wa.me/27837872798" target="_blank"><img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg">WhatsApp</a>
        </div>
      </div>
    </div>

    <div class="contact-item">
    
      <div>
        Address: 363 Donne Crescent, Lombardy East, Johannesburg, 2090
        <div class="inline-map">
          <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3582.346892743458!2d28.130504375326943!3d-26.16723096314264!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x1e9510cc8e3a4de1%3A0x1eb9d79577990215!2s363%20Donne%20Cres%2C%20Lombardy%20East%2C%20Johannesburg%2C%202090!5e0!3m2!1sen!2sza!4v1720181234567"
            allowfullscreen=""
            loading="lazy">
          </iframe>
        </div>
      </div>
    </div>

    <div class="contact-form">
      <h2>Send a Message</h2>
      <form id="contact-form">
        <input type="text" name="name" placeholder="Your Full Name" required />
        <input type="email" name="email" placeholder="Your Email Address" required />
        <textarea name="message" placeholder="Your Message" required></textarea>
        <button type="submit">Send Message</button>
        <div id="success-message">✅ Mail Sent Successfully!</div>
      </form>
    </div>
  </div>

  <script>
    const form = document.getElementById("contact-form");
    const successMessage = document.getElementById("success-message");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      // Simulate a successful send (since there's no backend)
      setTimeout(() => {
        successMessage.style.display = "block";
        form.reset();
      }, 500);
    });
  </script>

</body>
</html>
