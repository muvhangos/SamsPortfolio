<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Samuel</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to right, #f0f4f8, #d9e4f5);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    .contact-card {
      background: white;
      max-width: 800px;
      width: 100%;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.1);
      margin-bottom: 30px;
    }

    .contact-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .contact-header h1 {
      font-size: 30px;
      color: #2c3e50;
      margin-bottom: 8px;
    }

    .contact-header p {
      font-size: 16px;
      color: #666;
    }

    .contact-item {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
      font-size: 16px;
      color: #333;
    }

    .contact-item i {
      font-size: 20px;
      color: #1d4ed8;
      margin-right: 15px;
      min-width: 25px;
    }

    .label {
      font-weight: 600;
      color: #444;
    }

    a {
      color: #1d4ed8;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .map-container {
      width: 100%;
      height: 400px;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    @media screen and (max-width: 600px) {
      .contact-card {
        padding: 30px 20px;
      }

      .map-container {
        height: 300px;
      }
    }
  </style>
</head>
<body>

  <div class="contact-card">
    <div class="contact-header">
      <h1>Contact Samuel</h1>
      <p>Let's connect and talk about opportunities</p>
    </div>

    <div class="contact-item">
      <i class="fas fa-envelope"></i>
      <div><span class="label">Email:</span> <a href="mailto:muvhangos@gmail.com">muvhangos@gmail.com</a></div>
    </div>

    <div class="contact-item">
      <i class="fas fa-phone"></i>
      <div><span class="label">Phone:</span> +27 7249 55002</div>
    </div>

    <div class="contact-item">
      <i class="fas fa-mobile-alt"></i>
      <div><span class="label">Cell No:</span> +27 8378 72798</div>
    </div>

    <div class="contact-item">
      <i class="fas fa-map-marker-alt"></i>
      <div><span class="label">Address:</span> 363 Donne Crescent, Lombardy East, Johannesburg, 2090</div>
    </div>

    <div class="contact-item">
      <i class="fas fa-globe-africa"></i>
      <div><span class="label">Willing to Relocate:</span> Anywhere</div>
    </div>
  </div>

  <div class="map-container">
    <iframe
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3582.346892743458!2d28.130504375326943!3d-26.16723096314264!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x1e9510cc8e3a4de1%3A0x1eb9d79577990215!2s363%20Donne%20Cres%2C%20Lombardy%20East%2C%20Johannesburg%2C%202090!5e0!3m2!1sen!2sza!4v1720181234567"
      allowfullscreen=""
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade">
    </iframe>
  </div>

</body>
</html>
