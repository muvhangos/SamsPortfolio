<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Image Gallery</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f0f4f8;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #333;
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      margin-top: 30px;
    }

    .card {
      background-color: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      overflow: hidden;
      transition: transform 0.3s ease;
      max-width: 400px;
      width: 100%;
      cursor: pointer;
    }

    .card:hover {
      transform: scale(1.03);
    }

    .card img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.3s ease;
    }

    .caption {
      padding: 15px;
      text-align: center;
      font-weight: bold;
      color: #555;
    }

    /* Overlay */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .flip-container {
      perspective: 1000px;
    }

    .flipper {
      position: relative;
      width: 90vw;
      max-width: 600px;
      height: auto;
      transform-style: preserve-3d;
      transition: transform 0.8s ease;
      animation: zoomFlip 0.6s ease forwards;
    }

    .flipper img {
      width: 100%;
      border-radius: 10px;
      backface-visibility: hidden;
    }

    .flipper.flip {
      transform: rotateY(180deg) scale(1);
    }

    @keyframes zoomFlip {
      0% {
        transform: scale(0.3) rotateY(0deg);
        opacity: 0;
      }
      100% {
        transform: scale(1) rotateY(180deg);
        opacity: 1;
      }
    }

    @media (max-width: 600px) {
      .caption {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

  <h1>Flipping Zoom Gallery</h1>

  <div class="gallery">
    <div class="card" onclick="zoomImage(this)">
      <img src="Guessing-Game-Pic-full.webp" alt="Guessing Game">
      <div class="caption">Guessing Game</div>
    </div>

    <div class="card" onclick="zoomImage(this)">
      <img src="JS SuperCalculator.webp" alt="Calculator">
      <div class="caption">JS Super Calculator</div>
    </div>
  
    <div class="card" onclick="zoomImage(this)">
      <img src="Dream Car.jpg" alt="Calculator" />
      <div class="caption">Dream Car</div>
    </div>
	
	<div class="card" onclick="zoomImage(this)">
      <img src="Robot.jpg" alt="Calculator" />
      <div class="caption">Robot</div>
    </div>
	
	<div class="card" onclick="zoomImage(this)">
      <img src="ShoppingCart.jpg" alt="Calculator" />
      <div class="caption">Shopping Cart</div>
    </div>
	<div class="card" onclick="zoomImage(this)">
      <img src="Train.jpg" alt="Calculator" />
      <div class="caption">Train</div>
    </div>
	
	<div class="card" onclick="zoomImage(this)">
      <img src="Wishlist.jpg" alt="Calendar" />
      <div class="caption">Calendar</div>
    </div>
	
	
	<div class="card" onclick="zoomImage(this)">
      <img src="Weather Forcast.jpg" alt="Weather Forecast" />
      <div class="caption">Weather Forecast</div>
    </div>
	
	
	<div class="card">
      <img src="Samuel Muvhango.jpg" alt="Myself" />
      <div class="caption">Mr Samuel Muvhango</div>
    </div>
  <!-- Overlay -->
  <div class="overlay" id="zoomOverlay" onclick="closeZoom()">
    <div class="flip-container">
      <div class="flipper" id="flipper">
        <img id="zoomedImage" src="" alt="Zoomed" />
      </div>
    </div>
  </div>

  <script>
    function zoomImage(card) {
      const img = card.querySelector('img');
      const overlay = document.getElementById('zoomOverlay');
      const zoomedImage = document.getElementById('zoomedImage');
      const flipper = document.getElementById('flipper');

      zoomedImage.src = img.src;
      overlay.classList.add('active');
      flipper.classList.add('flip');
    }

    function closeZoom() {
      const overlay = document.getElementById('zoomOverlay');
      const flipper = document.getElementById('flipper');

      overlay.classList.remove('active');
      flipper.classList.remove('flip');
    }
  </script>

</body>
</html>
